<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produit - ZINA Jewelry</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />

  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-background-light dark:bg-background-dark text-zina-black dark:text-zina-ivory transition-colors duration-300">
<div id="header-container"></div>

  <main class="pt-24">
    <section class="pb-24">
      <div class="container">
        <div class="flex items-center gap-2 text-[10px] font-bold uppercase tracking-[0.2em] opacity-40 mb-12">
          <a href="/index.html" class="hover:text-primary transition-colors">Accueil</a>
          <span class="material-icons-outlined text-[10px]">chevron_right</span>
          <a href="/shop.html" class="hover:text-primary transition-colors">Boutique</a>
          <span class="material-icons-outlined text-[10px]">chevron_right</span>
          <span id="breadcrumb-product" class="text-primary opacity-100">Produit</span>
        </div>

        <div class="product-detail" id="product-detail">
          <!-- Dynamically injected -->
          <div class="animate-pulse flex flex-col md:flex-row gap-12">
            <div class="w-full aspect-square bg-zinc-100 rounded-3xl"></div>
            <div class="flex-grow space-y-6">
              <div class="h-4 w-24 bg-zinc-100 rounded"></div>
              <div class="h-12 w-64 bg-zinc-100 rounded"></div>
              <div class="h-8 w-32 bg-zinc-100 rounded"></div>
              <div class="h-32 w-full bg-zinc-100 rounded"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script src="/assets/js/storage.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/cart.js"></script>
  <script src="/assets/js/products.js"></script>
  <script src="/assets/js/orders.js"></script>
  <script src="/assets/js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const productId = App.getUrlParam('id');
      
      if (!productId) {
        window.location.href = '/shop.html';
        return;
      }

      const product = Products.getById(productId);
      
      if (!product) {
        App.showAlert('Produit introuvable', 'error');
        setTimeout(() => window.location.href = '/shop.html', 2000);
        return;
      }

      // Update breadcrumb
      document.getElementById('breadcrumb-product').textContent = product.name;

      // Render product detail
      const container = document.getElementById('product-detail');
      container.innerHTML = `
        <div class="product-image-wrapper">
          <img src="${product.image}" alt="${product.name}" class="product-detail-image"
               onerror="this.src='https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=500&h=500&fit=crop'">
        </div>
        <div class="product-detail-info">
          <span class="product-detail-category">${product.category}</span>
          <h1>${product.name}</h1>
          <div class="product-detail-price">${Cart.formatPrice(product.price)}</div>
          <p class="product-detail-description">${product.description || "Une pièce d'exception façonnée à la main, alliant élégance intemporelle et design contemporain. Chaque détail a été pensé pour sublimer votre allure."}</p>
          
          <div class="product-actions">
            <button class="btn btn-add-cart" id="add-to-cart-btn">Ajouter au panier</button>
            <a href="/shop.html" class="btn btn-continue text-center">Continuer mes achats</a>
          </div>
        </div>
      `;

      // Add to cart handler
      document.getElementById('add-to-cart-btn').addEventListener('click', () => {
        if (!Auth.isLoggedIn()) {
          App.showAlert('Veuillez vous connecter pour ajouter des articles au panier', 'info');
          setTimeout(() => window.location.href = '/auth/login.html', 1500);
          return;
        }

        const result = Cart.addItem(product.id, 1);
        if (result.success) {
          App.showAlert('Produit ajouté au panier !', 'success');
          Cart.updateCartBadge();
        }
      });
    });
  </script>
  <script src="/assets/js/shared-components.js"></script>
</body>
</html>
