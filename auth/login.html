<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Se connecter - ZINA</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />

  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/pages.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="header-container"></div>
  <main>
    <div class="auth-container">
      <div class="auth-box">
        <h1 class="text-3xl text-center mb-2">Bon retour</h1>
        <p class="auth-subtitle text-center mb-8">Connectez-vous à votre compte</p>

        <form id="login-form" onsubmit="return handleLogin(event)">
          <div class="form-group mb-4">
            <label class="block text-xs font-bold uppercase mb-2">Adresse e-mail</label>
            <input type="email" id="email" name="email" required class="w-full p-3 border rounded">
          </div>

          <div class="form-group mb-6">
            <label class="block text-xs font-bold uppercase mb-2">Mot de passe</label>
            <input type="password" id="password" name="password" required class="w-full p-3 border rounded">
          </div>

          <button type="submit" id="login-btn" class="btn btn-primary w-full py-4 bg-primary text-white font-bold uppercase tracking-widest hover:bg-black transition-colors">
            Se connecter
          </button>
        </form>

        <div class="auth-divider my-8 text-center opacity-50">OU</div>

        <p class="auth-link text-center">
          Vous n’avez pas de compte ?
          <a href="/auth/register.html" class="text-primary font-bold">Créer un compte</a>
        </p>
      </div>
    </div>
  </main>

  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/shared-components.js"></script>
  
  <script>
    function handleLogin(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      console.log('Login attempt:', email);

      try {
        if (typeof Auth === 'undefined') {
          alert("Erreur: Le système d'authentification n'est pas chargé.");
          return false;
        }

        const result = Auth.login(email, password);
        
        if (result.success) {
          if (typeof App !== 'undefined') {
            App.showAlert('Connexion réussie !', 'success');
          }
          setTimeout(() => {
            const target = result.user.role === 'admin' ? '/admin/dashboard.html' : '/index.html';
            window.location.replace(target);
          }, 800);
        } else {
          if (typeof App !== 'undefined') {
            App.showAlert(result.message, 'error');
          } else {
            alert(result.message);
          }
          const form = document.getElementById('login-form');
          form.classList.add('shake');
          setTimeout(() => form.classList.remove('shake'), 400);
        }
      } catch (err) {
        console.error(err);
        alert("Une erreur est survenue lors de la connexion.");
      }
      
      return false;
    }
  </script>
</body>
</html>
