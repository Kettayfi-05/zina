<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - ZINA</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
  
</head>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<!-- Google Fonts + Material Icons -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet"/>

<!-- Tailwind Config (IMPORTANT) -->
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#c6a15d",
          "background-light": "#f8f7f6",
          "background-dark": "#1e1a14",
          "zina-black": "#0F0F0F",
          "zina-ivory": "#F8F6F2",
          "zina-taupe": "#B7B0A5",
        },
        fontFamily: {
          "display": ["Manrope", "sans-serif"],
          "serif": ["Playfair Display", "serif"],
        },
      },
    },
  }
</script>

<body class="bg-background-light dark:bg-background-dark text-zina-black dark:text-zina-ivory transition-colors duration-300">
<div id="header-container"></div>

  <main>
    <section style="padding:var(--spacing-xl) 0;">
      <div class="container">
        <h1 class="text-3xl serif-text">Contactez-nous</h1>
        <p class="text-zina-taupe mb-8">Nous serions ravis de vous entendre.</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
          <div class="space-y-8">
            <h2 class="text-xl serif-text border-b border-primary/10 pb-4">À propos de nous</h2>
            <div class="space-y-4">
              <div><h4 class="text-xs font-bold uppercase tracking-widest text-primary">Email</h4><p>contactzina@gmail.com</p></div>
              <div><h4 class="text-xs font-bold uppercase tracking-widest text-primary">Téléphone</h4><p>+212 600 000 000</p></div>
              <div><h4 class="text-xs font-bold uppercase tracking-widest text-primary">Horaires</h4><p>Lundi-Vendredi: 9h - 18h<br>Samedi: 10h - 16h<br>Dimanche: Fermé</p></div>
            </div>
          </div>
          <div class="bg-white dark:bg-zinc-900 p-8 rounded-2xl shadow-sm border border-primary/5">
            <h2 class="text-xl serif-text mb-6">Envoyez-nous un message</h2>
            <form id="contact-form">
              <div class="form-group"><label>Nom</label><input type="text" name="name" required></div>
              <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
              <div class="form-group"><label>Sujet</label><input type="text" name="subject"></div>
              <div class="form-group"><label>Message</label><textarea name="message" required></textarea></div>
              <button type="submit" class="btn btn-primary">Envoyer un message</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>
<div id="footer-container"></div>
<script src="/assets/js/storage.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/cart.js"></script>
<script src="/assets/js/shared-components.js"></script>
<script src="/assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('contact-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const messageData = Object.fromEntries(formData);
        const result = Messages.create(messageData);
        if (result.success) {
          App.showAlert('Message sent successfully!', 'success');
          e.target.reset();
        } else {
          App.showAlert('Error sending message', 'error');
        }
      });
    });
  </script>
</body>
</html>
