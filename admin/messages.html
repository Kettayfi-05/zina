<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - ZINA Admin</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />

  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#c6a15d",
            "zina-black": "#0F0F0F",
          }
        }
      }
    }
  </script>
</head>
<body class="bg-background-light dark:bg-background-dark text-zina-black dark:text-zina-ivory transition-colors duration-300">
<div id="header-container"></div>

<main class="py-12 px-6 max-w-7xl mx-auto">
  <div class="flex flex-col md:flex-row gap-12">
    <!-- Admin Sidebar -->
    <aside class="w-full md:w-64 space-y-8">
      <div class="bg-white dark:bg-zinc-900 p-6 rounded-2xl shadow-sm border border-primary/5">
        <div class="w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center mb-4 mx-auto">
          <span class="material-icons-outlined text-3xl text-primary">email</span>
        </div>
        <div class="text-center">
          <h2 class="font-bold text-lg">Messages</h2>
          <p class="text-[10px] tracking-widest uppercase opacity-40">Support Client</p>
        </div>
      </div>
      
      <nav class="space-y-2">
        <a href="/admin/dashboard.html" class="w-full text-left px-6 py-3 rounded-xl hover:bg-white dark:hover:bg-zinc-800 font-medium flex items-center gap-3 transition-all">
          <span class="material-icons-outlined">dashboard</span>
          Tableau de bord
        </a>
        <a href="/admin/products.html" class="w-full text-left px-6 py-3 rounded-xl hover:bg-white dark:hover:bg-zinc-800 font-medium flex items-center gap-3 transition-all">
          <span class="material-icons-outlined">inventory_2</span>
          Produits
        </a>
        <a href="/admin/orders.html" class="w-full text-left px-6 py-3 rounded-xl hover:bg-white dark:hover:bg-zinc-800 font-medium flex items-center gap-3 transition-all">
          <span class="material-icons-outlined">shopping_cart</span>
          Commandes
        </a>
        <a href="/admin/clients.html" class="w-full text-left px-6 py-3 rounded-xl hover:bg-white dark:hover:bg-zinc-800 font-medium flex items-center gap-3 transition-all">
          <span class="material-icons-outlined">people</span>
          Clients
        </a>
        <a href="/admin/reviews.html" class="w-full text-left px-6 py-3 rounded-xl hover:bg-white dark:hover:bg-zinc-800 font-medium flex items-center gap-3 transition-all">
          <span class="material-icons-outlined">rate_review</span>
          Avis
        </a>
        <a href="/admin/notifications.html" class="w-full text-left px-6 py-3 rounded-xl hover:bg-white dark:hover:bg-zinc-800 font-medium flex items-center gap-3 transition-all">
          <span class="material-icons-outlined">notifications</span>
          Notifications
        </a>
        <a href="/admin/messages.html" class="w-full text-left px-6 py-3 rounded-xl bg-primary text-white font-medium flex items-center gap-3 transition-all shadow-lg shadow-primary/20">
          <span class="material-icons-outlined">email</span>
          Messages
        </a>
        <a href="/admin/chatbot.html" class="w-full text-left px-6 py-3 rounded-xl hover:bg-white dark:hover:bg-zinc-800 font-medium flex items-center gap-3 transition-all">
          <span class="material-icons-outlined">psychology</span>
          Entraîner le Bot
        </a>
      </nav>
    </aside>

    <!-- Content -->
    <section class="flex-grow space-y-12">
      <h1 class="text-4xl serif-text">Messages reçus</h1>

      <!-- Messages List -->
      <div id="messages-list" class="grid gap-6">
        <!-- Messages injected here -->
      </div>
    </section>
  </div>
</main>

<div id="footer-container"></div>

<script src="/assets/js/storage.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/cart.js"></script>
<script src="/assets/js/products.js"></script>
<script src="/assets/js/orders.js"></script>
<script src="/assets/js/admin.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/shared-components.js"></script>

<script>
  Auth.requireAdmin();
  
  document.addEventListener('DOMContentLoaded', () => {
    renderAdminMessages();
  });

  function renderAdminMessages() {
    const messages = Storage.get('zina_messages') || [];
    const container = document.getElementById('messages-list');
    
    if (messages.length === 0) {
      container.innerHTML = '<div class="p-20 text-center bg-white rounded-3xl border border-dashed border-primary/20 text-zinc-400">Aucun message pour le moment.</div>';
      return;
    }

    container.innerHTML = messages.reverse().map((msg, index) => `
      <div class="bg-white dark:bg-zinc-900 p-8 rounded-3xl border border-primary/5 shadow-sm hover:border-primary/20 transition-all space-y-4">
        <div class="flex justify-between items-start">
          <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center font-bold text-primary text-xs">
              ${msg.name.charAt(0).toUpperCase()}
            </div>
            <div>
              <h3 class="font-bold text-lg">${msg.name}</h3>
              <p class="text-xs text-zinc-400 font-light">${msg.email}</p>
            </div>
          </div>
          <button onclick="deleteMessage(${index})" class="material-icons-outlined text-zinc-300 hover:text-red-500 transition-colors">delete</button>
        </div>
        
        <div class="py-4 border-y border-primary/5">
          <p class="text-[10px] font-black uppercase tracking-widest text-primary mb-2">${msg.subject || 'SANS SUJET'}</p>
          <p class="text-zinc-600 font-light leading-relaxed">${msg.message}</p>
        </div>
        
        <div class="flex justify-between items-center text-[10px] uppercase tracking-widest text-zinc-400">
          <span>Reçu le ${new Date().toLocaleDateString()}</span>
          <a href="mailto:${msg.email}" class="flex items-center gap-2 text-primary font-bold hover:gap-3 transition-all">
            Répondre par email
            <span class="material-icons-outlined text-xs">arrow_forward</span>
          </a>
        </div>
      </div>
    `).join('');
  }

  window.deleteMessage = (index) => {
    if (confirm('Supprimer ce message ?')) {
      const messages = Storage.get('zina_messages') || [];
      messages.splice(messages.length - 1 - index, 1);
      Storage.set('zina_messages', messages);
      App.showAlert('Message supprimé', 'success');
      renderAdminMessages();
    }
  };
</script>
</body>
</html>
